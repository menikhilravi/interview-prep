<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex,nofollow">
<title>ML Platform Prep Log</title>
<meta name="description" content="A 21-week ML-platform interview prep log.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#EFF3F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080C12" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prep Log">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=JetBrains+Mono:wght@400;500;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* ── tokens: complete light palette on bare :root ─────────────────────── */
:root{
  --ground:#EFF3F8; --surface:#FFFFFF; --surface-2:#F5F8FB; --surface-3:#E6ECF3; --sunken:#E4EAF2;
  --ink:#0C121B; --ink-soft:#4E6076; --ink-faint:#64768B;
  --line:#DDE5EE; --line-strong:#C2CEDC; --grid:#EAEFF5;
  --run:#1F5FC4;   --run-bg:#E6EEFB;  --run-edge:#BCD3F4;
  --done:#14795A;  --done-bg:#E2F1EA; --done-edge:#B4DCCB;
  --fall:#8A6206;  --fall-bg:#F8EEDC; --fall-edge:#E6D2A6;
  --alert:#B4322D; --alert-bg:#FBE7E4; --alert-edge:#F0C4BF;
  --ord1:#86b6ef; --ord2:#5598e7; --ord3:#2a78d6; --ord4:#1c5cab; --ord5:#104281;
  --onfill:#FFFFFF;
  --e1:0 1px 2px rgba(12,18,27,.06);
  --e2:0 2px 4px rgba(12,18,27,.06),0 8px 20px rgba(12,18,27,.07);
  --e3:0 8px 16px rgba(12,18,27,.10),0 24px 48px rgba(12,18,27,.12);
  --ringtrack:#DFE7F1;
  --disp:'Archivo',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --body:'Public Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:22px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#080C12; --surface:#111721; --surface-2:#18202C; --surface-3:#212B39; --sunken:#050810;
  --ink:#E9EFF7; --ink-soft:#93A5BC; --ink-faint:#7C8FA8;
  --line:#1C2531; --line-strong:#2B3644; --grid:#161E29;
  --run:#5B9BF5;   --run-bg:#12253D;  --run-edge:#1E3A5C;
  --done:#3FCF8E;  --done-bg:#0E2A20; --done-edge:#1A4535;
  --fall:#F0B44A;  --fall-bg:#2E220C; --fall-edge:#4A3714;
  --alert:#F2706A; --alert-bg:#301518; --alert-edge:#4E2226;
  --ord1:#cde2fb; --ord2:#9ec5f4; --ord3:#6da7ec; --ord4:#3987e5; --ord5:#256abf;
  --onfill:#080C12;
  --e1:0 1px 2px rgba(0,0,0,.5);
  --e2:0 2px 4px rgba(0,0,0,.45),0 8px 20px rgba(0,0,0,.4);
  --e3:0 8px 16px rgba(0,0,0,.5),0 24px 48px rgba(0,0,0,.55);
  --ringtrack:#1C2531;
}}
:root[data-theme="dark"]{
  --ground:#080C12; --surface:#111721; --surface-2:#18202C; --surface-3:#212B39; --sunken:#050810;
  --ink:#E9EFF7; --ink-soft:#93A5BC; --ink-faint:#7C8FA8;
  --line:#1C2531; --line-strong:#2B3644; --grid:#161E29;
  --run:#5B9BF5;   --run-bg:#12253D;  --run-edge:#1E3A5C;
  --done:#3FCF8E;  --done-bg:#0E2A20; --done-edge:#1A4535;
  --fall:#F0B44A;  --fall-bg:#2E220C; --fall-edge:#4A3714;
  --alert:#F2706A; --alert-bg:#301518; --alert-edge:#4E2226;
  --ord1:#cde2fb; --ord2:#9ec5f4; --ord3:#6da7ec; --ord4:#3987e5; --ord5:#256abf;
  --onfill:#080C12;
  --e1:0 1px 2px rgba(0,0,0,.5);
  --e2:0 2px 4px rgba(0,0,0,.45),0 8px 20px rgba(0,0,0,.4);
  --e3:0 8px 16px rgba(0,0,0,.5),0 24px 48px rgba(0,0,0,.55);
  --ringtrack:#1C2531;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow-x:hidden;
  overscroll-behavior-y:contain}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:left}
a{color:var(--run)}
:focus-visible{outline:2px solid var(--run);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;font-family:var(--disp);font-variation-settings:'wdth' 112;letter-spacing:-.015em;text-wrap:balance}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ── motion ───────────────────────────────────────────────────────────── */
@keyframes rise{from{opacity:.55;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}38%{transform:scale(.82)}70%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes sweep{from{stroke-dashoffset:var(--c)}to{stroke-dashoffset:var(--o)}}
@keyframes sheetup{from{transform:translateY(26px);opacity:.4}to{transform:none;opacity:1}}
@keyframes scrimin{from{opacity:0}to{opacity:1}}
@keyframes cele{0%{transform:scale(.9);opacity:0}55%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.stagger>*{animation:rise .34s cubic-bezier(.22,1,.36,1) both}
.stagger>*:nth-child(1){animation-delay:0ms}.stagger>*:nth-child(2){animation-delay:26ms}
.stagger>*:nth-child(3){animation-delay:52ms}.stagger>*:nth-child(4){animation-delay:78ms}
.stagger>*:nth-child(5){animation-delay:104ms}.stagger>*:nth-child(6){animation-delay:130ms}
.stagger>*:nth-child(n+7){animation-delay:150ms}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.001ms!important}
}

/* ── shell ────────────────────────────────────────────────────────────── */
.app{max-width:560px;margin:0 auto;padding:0 13px calc(84px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;margin:0 -13px 10px;padding:11px 13px 9px;
  background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(14px) saturate(1.4);
  border-bottom:1px solid var(--line)}
.tbrow{display:flex;align-items:center;gap:9px}
.brand{flex:1;min-width:0}
.brand b{display:block;font-family:var(--disp);font-variation-settings:'wdth' 118;font-weight:700;
  font-size:15px;letter-spacing:-.01em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-faint);margin-top:1px}
.save{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--ink-faint);
  display:flex;align-items:center;gap:5px;white-space:nowrap}
.save i{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);flex:none;display:block}
.save.ok i{background:var(--done)}
.save.busy i{background:var(--fall);animation:pulse 1.1s ease-in-out infinite}
.save.bad i{background:var(--alert)} .save.bad{color:var(--alert)}
.gear{width:36px;height:36px;flex:none;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:var(--r-s);background:var(--surface);color:var(--ink-soft);box-shadow:var(--e1);
  transition:transform .16s,background .16s}
.gear:active{transform:scale(.93)}

/* ── pull-to-today ────────────────────────────────────────────────────── */
.pull{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--run);
  transition:height .18s ease}
.pull.armed{color:var(--done)}

/* ── hero ─────────────────────────────────────────────────────────────── */
.hero{display:flex;gap:15px;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-l);padding:14px;box-shadow:var(--e2);margin-bottom:11px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(120% 80% at 12% 0%,color-mix(in srgb,var(--st) 12%,transparent),transparent 62%)}
.ring{width:98px;height:98px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring .tr{stroke:var(--ringtrack)}
.ring .arc{stroke:var(--st);transition:stroke-dashoffset .62s cubic-bezier(.22,1,.36,1),stroke .3s}
.ring .out{stroke:var(--done)} .ring .outf{stroke:var(--fall)}
.ringmid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.ringmid b{font-family:var(--mono);font-size:23px;font-weight:700;line-height:1;color:var(--st);
  font-variant-numeric:tabular-nums}
.ringmid s{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-faint);text-decoration:none}
.herobody{flex:1;min-width:0}
.stchip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;padding:4px 8px;border-radius:99px;
  background:var(--st-bg);color:var(--st);border:1px solid var(--st-edge)}
.stchip i{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.herobody h2{font-size:17px;font-weight:700;line-height:1.15;margin:8px 0 0}
.herostats{display:flex;gap:13px;margin-top:9px;flex-wrap:wrap}
.hs{min-width:0}
.hs b{display:block;font-family:var(--mono);font-size:15px;font-weight:700;line-height:1.1;
  font-variant-numeric:tabular-nums}
.hs span{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-faint);margin-top:2px}
.hs.flame b{color:var(--fall)}

/* ── phase grid ───────────────────────────────────────────────────────── */
.pbtn{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:9px;min-height:44px;box-shadow:var(--e1)}
.pmeta{font-family:var(--mono);font-size:10px;color:var(--ink-soft);white-space:nowrap;
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
.pbar{flex:1;height:6px;border-radius:99px;background:var(--sunken);overflow:hidden;display:flex;min-width:36px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.14)}
.pbar span{display:block;height:100%;transition:width .5s cubic-bezier(.22,1,.36,1)}
.pbar .c{background:var(--done)} .pbar .f{background:var(--fall);margin-left:2px}
.caret{font-size:9px;color:var(--ink-faint);flex:none;transition:transform .22s}
.caret.open{transform:rotate(180deg)}
.gwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:11px;
  margin-bottom:9px;box-shadow:var(--e1)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.gh{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--ink-faint);text-align:center;padding-bottom:2px}
.gc{aspect-ratio:1;min-height:32px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface-2);
  font-family:var(--mono);font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--ink-faint);
  display:grid;place-items:center;padding:0;transition:transform .16s,box-shadow .16s}
.gc:active{transform:scale(.9)}
.gc.s-running{border-color:var(--run);color:var(--run);background:var(--run-bg);font-weight:700}
.gc.s-complete{border-color:var(--done);background:var(--done);color:var(--onfill);font-weight:700}
.gc.s-fallback{border-color:var(--fall);background:var(--fall);color:var(--onfill);font-weight:700}
.gc.here{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.grid.wk{grid-template-columns:26px repeat(7,1fr)}
.wklab{font-family:var(--mono);font-size:8.5px;color:var(--ink-faint);display:grid;place-items:center;
  font-variant-numeric:tabular-nums}
.gc.lite:not(.s-complete):not(.s-fallback):not(.s-running){background:var(--surface-3);border-style:dashed}
.gc.lite.s-running{border-style:dashed}
.mapscroll{max-height:400px;overflow-y:auto;overscroll-behavior:contain;margin:0 -3px;padding:0 3px}
.legend{display:flex;flex-wrap:wrap;gap:5px 13px;font-family:var(--mono);font-size:9px;letter-spacing:.06em;
  color:var(--ink-faint);padding-top:10px;margin-top:9px;border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;flex:none;border:1px solid transparent}

/* ── day nav ──────────────────────────────────────────────────────────── */
.daynav{display:flex;align-items:center;gap:8px;margin:0 0 11px}
.nav{width:40px;height:40px;flex:none;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);
  display:grid;place-items:center;color:var(--ink-soft);font-family:var(--mono);font-size:16px;box-shadow:var(--e1);
  transition:transform .16s}
.nav:active{transform:scale(.92)} .nav[disabled]{opacity:.3;box-shadow:none}
.daymeta{flex:1;min-width:0;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-faint);display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.jump{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;color:var(--run);border:1px solid var(--run);
  border-radius:var(--r-s);padding:0 10px;height:40px;flex:none;display:grid;place-items:center;
  background:var(--run-bg);text-transform:uppercase}
.weeknote{font-size:13px;color:var(--ink-soft);border-left:2px solid var(--line-strong);padding:2px 0 2px 11px;
  margin:0 0 12px;text-wrap:pretty}

/* ── blocks ───────────────────────────────────────────────────────────── */
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:9px;
  overflow:hidden;box-shadow:var(--e1);transition:box-shadow .25s,border-color .25s}
.block.done{border-color:var(--done-edge)}
.block.rev{border-color:var(--alert-edge);box-shadow:var(--e2)}
.bhead{display:flex;align-items:center;gap:8px;padding:11px 13px 7px;flex-wrap:wrap}
.blabel{font-family:var(--disp);font-variation-settings:'wdth' 118;font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase}
.bmeta{font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;color:var(--ink-faint)}
.bprog{margin-left:auto;display:flex;align-items:center;gap:7px}
.bprog em{font-family:var(--mono);font-size:9.5px;font-style:normal;color:var(--ink-faint);
  font-variant-numeric:tabular-nums}
.mini-bar{width:34px;height:4px;border-radius:99px;background:var(--sunken);overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--done);transition:width .4s cubic-bezier(.22,1,.36,1)}
.res{display:flex;flex-wrap:wrap;gap:5px;padding:0 13px 9px}
.res a{font-family:var(--mono);font-size:9.5px;text-decoration:none;color:var(--run);background:var(--run-bg);
  border:1px solid var(--run-edge);border-radius:99px;padding:4px 9px;line-height:1.3;transition:transform .15s}
.res a:active{transform:scale(.95)}

.row{display:flex;align-items:flex-start;gap:12px;padding:10px 13px;min-height:48px;width:100%;
  border-top:1px solid var(--line);transition:background .18s}
.bhead+.row,.res+.row{border-top:0}
.row:active{background:var(--surface-2)}
.box{width:22px;height:22px;flex:none;margin-top:1px;border:1.5px solid var(--line-strong);border-radius:7px;
  background:var(--surface-2);display:grid;place-items:center;font-size:12px;color:transparent;line-height:1;
  transition:background .2s,border-color .2s,color .12s}
.row.on .box{background:var(--done);border-color:var(--done);color:var(--onfill);animation:pop .34s cubic-bezier(.3,1.4,.5,1)}
.rtext{flex:1;min-width:0;font-size:14px;line-height:1.42;text-wrap:pretty}
.row.on .rtext{color:var(--ink-soft)}
.row.on .rtext .t{text-decoration:line-through;text-decoration-color:var(--line-strong)}
.lc{display:inline-block;font-family:var(--mono);font-size:9.5px;color:var(--run);text-decoration:none;
  border-bottom:1px solid currentColor;margin-left:6px;white-space:nowrap}
.tag{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  border-radius:4px;padding:3px 6px;flex:none;align-self:flex-start;margin-top:3px;border:1px solid transparent}
.tag.due{background:var(--alert-bg);color:var(--alert);border-color:var(--alert-edge)}
.tag.dsa{background:var(--surface-3);color:var(--ink-faint)}
.graded{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);letter-spacing:.02em;
  padding:0 13px 10px 47px;margin-top:-5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.graded u{text-decoration:none;color:var(--run);border-bottom:1px solid currentColor;cursor:pointer;padding:4px 0}

/* ── mvd ──────────────────────────────────────────────────────────────── */
.mvd{border:1px solid var(--fall-edge);background:linear-gradient(180deg,var(--fall-bg),var(--surface));
  border-radius:var(--r-m);margin:13px 0 4px;overflow:hidden;box-shadow:var(--e1);transition:box-shadow .3s}
.mvd.on{box-shadow:var(--e2),0 0 0 1px var(--fall)}
.mvd .blabel{color:var(--fall)} .mvd .bmeta{color:var(--fall);opacity:.9}
.mvd .row{border-top:0;padding-top:4px}
.mvd .box{border-color:var(--fall);background:transparent}
.mvd.on .box{background:var(--fall);border-color:var(--fall);color:var(--onfill)}
.mvd.on .rtext,.mvd.on .rtext .t{color:var(--ink);text-decoration:none;font-weight:600}
.mvdnote{font-size:12px;color:var(--fall);padding:0 13px 12px 47px;line-height:1.4;text-wrap:pretty;font-weight:500}

/* ── screen heads ─────────────────────────────────────────────────────── */
.shead{display:flex;align-items:flex-start;gap:9px;margin:2px 0 13px}
.shead .t{flex:1;min-width:0}
.shead .eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-faint);display:flex;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.shead h1{font-size:25px;font-weight:800;font-variation-settings:'wdth' 118;line-height:1.05;letter-spacing:-.02em}
.sechead{display:flex;align-items:baseline;gap:9px;margin:20px 2px 9px}
.sechead h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-variation-settings:'wdth' 118}
.sechead .n{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-left:auto;
  font-variant-numeric:tabular-nums}
.sechead button{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--run);
  text-transform:uppercase;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}

/* ── list rows ────────────────────────────────────────────────────────── */
.lrow{display:flex;align-items:center;gap:11px;width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-m);padding:12px;margin-bottom:8px;min-height:60px;box-shadow:var(--e1);
  transition:transform .16s,box-shadow .18s;position:relative;overflow:hidden}
.lrow:active{transform:scale(.987);box-shadow:var(--e1)}
.lrow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bar,transparent)}
.lrow.rusty{--bar:var(--alert)} .lrow.okay{--bar:var(--fall)} .lrow.crisp{--bar:var(--done)}
.lrow.overdue{--bar:var(--alert)} .lrow.duetoday{--bar:var(--run)} .lrow.grad{--bar:var(--done);opacity:.75}
.lmain{flex:1;min-width:0}
.ltitle{font-size:14px;font-weight:500;line-height:1.32;text-wrap:pretty;display:block}

const $  = s => document.querySelector(s);
const p2 = n => String(n).padStart(2,"0");
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const attr = s => esc(s);
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
function addDays(iso,n){ const [y,m,d]=iso.split("-").map(Number); const dt=new Date(y,m-1,d+n);
  return dt.getFullYear()+"-"+p2(dt.getMonth()+1)+"-"+p2(dt.getDate()); }
function dayDiff(a,b){ return Math.round((Date.parse(b+"T00:00:00")-Date.parse(a+"T00:00:00"))/86400000); }
function relDay(iso){ if(!iso) return "never";
  const n = dayDiff(iso, todayISO());
  if(n===0) return "today"; if(n===1) return "yesterday"; if(n===-1) return "tomorrow";
  return n>0 ? n+"d ago" : "in "+(-n)+"d"; }
function fmtDate(iso){ if(!iso) return "—";
  const [y,m,d]=iso.split("-").map(Number);
  return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1]+" "+d; }
const isLC = u => !!u && /leetcode\.com\/problems\//.test(u);

/* ══════════════════════════════════════════════════════════════════════════
   DAY MODEL — seed NDAYS days, overlay per-day user edits
   ══════════════════════════════════════════════════════════════════════ */
function seedDay(n){
  const w = Math.floor((n-1)/7)+1, d = (n-1)%7;
  const stage = stageFor(w), src = PLANWEEKS[w-1][d], light = src.light === true;
  const mk = (blk, items) => (items||[]).map((it,i) => typeof it === "string"
      ? { id:"d"+n+"-"+blk+i, text:it }
      : { id:"d"+n+"-"+blk+i, text:it.t, url:it.u });
  const m = src.m;
  return {
    n, week:w, weekday:DOWN[d], title:src.t, weekNote:stage.note, stage:stage.name, light,
    heads:{ a: src.h, b:"if you have more time", f:"one-handed" },
    res:{ a: src.res || [], b:[] },
    blocks:{ a: mk("a", src.items), b:[], f:[] },
    hasB:false,
    mvd: typeof m === "string" ? { id:"d"+n+"-m0", text:m } : { id:"d"+n+"-m0", text:m.t, url:m.u }
  };
}
const SEED_DAYS = Array.from({length:NDAYS},(_,i)=>seedDay(i+1));

function getDay(n){
  const base = SEED_DAYS[n-1];
  const ov = S.dayOverrides[n];
  if(!ov) return base;
  return Object.assign({}, base, {
    blocks:{ a: ov.blocks.a||[], b: ov.blocks.b||[], f: ov.blocks.f||[] },
    mvd: ov.mvd || base.mvd,
    hasB: true, edited:true
  });
}
function materialize(n){
  if(S.dayOverrides[n]) return S.dayOverrides[n];
  const b = SEED_DAYS[n-1];
  const clone = x => JSON.parse(JSON.stringify(x));
  S.dayOverrides[n] = { blocks:{ a:clone(b.blocks.a), b:clone(b.blocks.b), f:clone(b.blocks.f) }, mvd:clone(b.mvd) };
  return S.dayOverrides[n];
}
function allTaskIds(n){ const d=getDay(n); return [].concat(d.blocks.a,d.blocks.b,d.blocks.f).map(t=>t.id); }
function dayState(n){
  const ids = allTaskIds(n), done = ids.filter(id=>S.checks[id]).length;
  if(ids.length && done===ids.length) return "complete";
  if(S.checks[getDay(n).mvd.id]) return "fallback";
  return done > 0 ? "running" : "queued";
}
const isDone = st => st==="complete" || st==="fallback";
function daysDone(){ let c=0,f=0; for(let n=1;n<=NDAYS;n++){ const s=dayState(n); if(s==="complete")c++; else if(s==="fallback")f++; } return {complete:c,fallback:f,total:c+f}; }
function curDay(){ return Math.max(1, Math.min(NDAYS, dayDiff(S.settings.startDate, todayISO()) + 1)); }
function activeDay(){ return viewDay == null ? curDay() : viewDay; }

/* ══════════════════════════════════════════════════════════════════════════
   SPACED REPETITION
   ══════════════════════════════════════════════════════════════════════ */
function applyGrade(slug, title, url, grade){
  const t = todayISO();
  const log = (S.grades[slug] = S.grades[slug] || []);
  log.push({ d:t, g:grade, n:title || slug });
  if(log.length > 60) log.shift();
  let e = S.queue[slug];
  if(!e){
    if(grade === "clean") return null;                 // clean first pass never enters the queue
    e = S.queue[slug] = { slug, title, url, stage:-1, due:null, last:null, lastGrade:null, graduated:false, history:[] };
  }
  const before = { sb:e.stage, db:e.due, gb:e.graduated };
  if(grade === "clean"){
    const ns = e.stage + 1;
    if(ns >= INTERVALS.length){ e.stage = INTERVALS.length-1; e.graduated = true; e.due = null; }
    else { e.stage = ns; e.graduated = false; e.due = addDays(t, INTERVALS[ns]); }
  } else if(grade === "struggled"){
    const s = Math.max(0, e.stage);
    e.stage = s; e.graduated = false; e.due = addDays(t, INTERVALS[s]);
  } else {
    e.stage = 0; e.graduated = false; e.due = addDays(t, INTERVALS[0]);
  }
  e.last = t; e.lastGrade = grade;
  if(title) e.title = title; if(url) e.url = url;
  e.history.push(Object.assign(before, { d:t, g:grade }));
  if(e.history.length > 20) e.history.shift();
  return e;
}
function undoGrade(slug){
  const log = S.grades[slug];
  if(log && log.length){ log.pop(); if(!log.length) delete S.grades[slug]; }
  const e = S.queue[slug]; if(!e || !e.history.length) return;
  const h = e.history.pop();
  e.stage = h.sb; e.due = h.db; e.graduated = !!h.gb;
  const prev = e.history[e.history.length-1];
  e.last = prev ? prev.d : null;
  e.lastGrade = prev ? prev.g : null;
  if(h.sb === -1 && !e.history.length) delete S.queue[slug];
}
const GRANK = { failed:0, struggled:1, clean:2 };
function dueReviews(){
  const t = todayISO();
  return Object.values(S.queue)
    .filter(e => !e.graduated && e.due && dayDiff(e.due, t) >= 0)
    .sort((a,b) => (dayDiff(t,a.due) - dayDiff(t,b.due)) || ((GRANK[a.lastGrade]??3) - (GRANK[b.lastGrade]??3)) || a.title.localeCompare(b.title));
}
function upcomingReviews(){
  const t = todayISO();
  return Object.values(S.queue).filter(e => !e.graduated && e.due && dayDiff(e.due,t) < 0)
    .sort((a,b) => a.due.localeCompare(b.due));
}
const graduatedReviews = () => Object.values(S.queue).filter(e => e.graduated).sort((a,b)=>(b.last||"").localeCompare(a.last||""));
const intervalLabel = e => e.graduated ? "graduated" : (e.stage >= 0 ? "+"+INTERVALS[e.stage]+"d" : "new");

    if(la !== lb) return la.localeCompare(lb);                 // never ("") first, then oldest

  });

const GORDER = { rusty:1, okay:2, crisp:3 };
function sortedDesigns(){
  return allDesigns().slice().sort((a,b) => {
    const ra = S.designs[a.id] || {}, rb = S.designs[b.id] || {};
    const ga = GORDER[ra.grade] || 0, gb = GORDER[rb.grade] || 0;   // never-graded = weakest
    if(ga !== gb) return ga - gb;
    const la = ra.last || "", lb = rb.last || "";
    if(la !== lb) return la.localeCompare(lb);                      // then stalest
    return 0;
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   STORAGE — db capability, batched into four documents. localStorage is a
   degraded fallback only, and says so on screen.
   ══════════════════════════════════════════════════════════════════════ */
const IDB_NAME = "prep-log", IDB_STORE = "state", IDB_VER = 1;
const DOCS = {
  progress: () => ({ checks:S.checks, grades:S.grades }),
  queue:    () => ({ items:S.queue }),
  banks:    () => ({ stories:S.stories, designs:S.designs, customStories:S.customStories, customDesigns:S.customDesigns }),
  plan:     () => ({ dayOverrides:S.dayOverrides, settings:S.settings, seq:S.seq })
};
const DOC_NAMES = Object.keys(DOCS);
let idb = null, mode = "init", dirty = new Set(), touched = new Set(), flushT = null, persisted = false;

function setSave(kind, text){
  const el = $("#save"); if(!el) return;
  el.className = "save " + kind;
  el.innerHTML = '<i></i>' + esc(text);
}
function markDirty(name){
  dirty.add(name); touched.add(name);
  setSave("busy","saving");
  clearTimeout(flushT); flushT = setTimeout(flush, 400);
}
function idbOpen(){
  return new Promise((res, rej) => {
    let r; try{ r = indexedDB.open(IDB_NAME, IDB_VER); }catch(e){ return rej(e); }
    r.onupgradeneeded = () => { const d = r.result; if(!d.objectStoreNames.contains(IDB_STORE)) d.createObjectStore(IDB_STORE); };
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
    r.onblocked = () => rej(new Error("blocked"));
  });
}
function idbGet(d, k){
  return new Promise((res, rej) => { const q = d.transaction(IDB_STORE,"readonly").objectStore(IDB_STORE).get(k);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
function idbPut(d, k, v){
  return new Promise((res, rej) => { const t = d.transaction(IDB_STORE,"readwrite");
    t.objectStore(IDB_STORE).put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
}
async function flush(){
  if(!dirty.size) return;
  const names = [...dirty]; dirty.clear();
  if(mode !== "idb" || !idb){ names.forEach(n => dirty.add(n)); return; }
  try{
    await Promise.all(names.map(n => idbPut(idb, n, Object.assign({ v:1, at:new Date().toISOString() }, DOCS[n]()))));
    setSave(dirty.size ? "busy" : "ok", dirty.size ? "saving" : "saved");
  }catch(err){
    names.forEach(n => dirty.add(n));
    setSave("bad", (err && err.name === "QuotaExceededError") ? "storage full" : "not saved");
  }
}
function snapshot(){ const o = {}; DOC_NAMES.forEach(n => o[n] = DOCS[n]()); return o; }
function absorb(name, data){
  if(!data || touched.has(name)) return;
  if(name === "progress"){ S.checks = data.checks || {}; S.grades = data.grades || {}; }
  else if(name === "queue"){ S.queue = data.items || {}; }
  else if(name === "banks"){
    S.stories = data.stories || {}; S.designs = data.designs || {};
    S.customStories = data.customStories || []; S.customDesigns = data.customDesigns || [];
  } else if(name === "plan"){
    S.dayOverrides = data.dayOverrides || {};
    S.settings = Object.assign({ startDate: DEFAULT_START }, data.settings || {});
    S.seq = data.seq || 1;
  }
}
async function connect(){
  try{
    idb = await idbOpen(); mode = "idb";
    const vals = await Promise.all(DOC_NAMES.map(n => idbGet(idb, n)));
    vals.forEach((v,i) => { if(v) absorb(DOC_NAMES[i], v); });
    setSave(dirty.size ? "busy" : "ok", dirty.size ? "saving" : "saved");
  }catch(e){ mode = "none"; setSave("bad","storage unavailable"); }
  // ask the browser not to evict this data under storage pressure
  try{
    if(navigator.storage && navigator.storage.persist)
      persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist());
  }catch(e){}
  render();
  if(dirty.size) flush();
}
async function reconcile(){
  if(mode !== "idb" || !idb || dirty.size) return;
  try{
    const vals = await Promise.all(DOC_NAMES.map(n => idbGet(idb, n)));
    touched.clear();
    vals.forEach((v,i) => { if(v) absorb(DOC_NAMES[i], v); });
    render();
  }catch(e){}
}


/* ══════════════════════════════════════════════════════════════════════════
   ANALYTICS
   ══════════════════════════════════════════════════════════════════════ */
function streakFrom(end){ let s=0,n=end; while(n>=1 && isDone(dayState(n))){ s++; n--; } return s; }
function currentStreak(){ const c = Math.min(NDAYS, curDay()); return isDone(dayState(c)) ? streakFrom(c) : streakFrom(c-1); }
function bestStreak(){ let best=0, run=0; for(let n=1;n<=NDAYS;n++){ if(isDone(dayState(n))){ run++; if(run>best) best=run; } else run=0; } return best; }

const GKEY = { clean:"clean", struggled:"struggled", failed:"failed" };
function allGrades(){ const out=[]; Object.keys(S.grades).forEach(k => (S.grades[k]||[]).forEach(h => out.push({ slug:k, d:h.d, g:h.g }))); return out; }
function outcomeTotals(){
  const t = { clean:0, struggled:0, failed:0 };
  allGrades().forEach(h => { if(t[h.g] != null) t[h.g]++; });
  t.total = t.clean + t.struggled + t.failed;
  t.rate = t.total ? Math.round(t.clean / t.total * 100) : null;
  return t;
}
function outcomeByDay(limit){
  const map = {};
  allGrades().forEach(h => { const b = map[h.d] = map[h.d] || { clean:0, struggled:0, failed:0 }; if(b[h.g] != null) b[h.g]++; });
  return Object.keys(map).sort().slice(-limit).map(d => Object.assign({ d }, map[d]));
}
function blockStats(){
  const acc = { s:[0,0], l:[0,0], m:[0,0] };
  for(let n=1;n<=NDAYS;n++){
    const d = getDay(n), k = d.light ? "l" : "s";
    ["a","b","f"].forEach(b => d.blocks[b].forEach(t => { acc[k][1]++; if(S.checks[t.id]) acc[k][0]++; }));
    acc.m[1]++; if(S.checks[d.mvd.id]) acc.m[0]++;
  }
  return acc;
}
function stageCounts(){
  const c = [0,0,0,0,0];
  Object.values(S.queue).forEach(e => { if(e.graduated) c[4]++; else if(e.stage >= 0) c[e.stage]++; });
  return c;
}
/* Coverage: unique problems and designs cleared, against what the plan holds.
   Distinct from outcomeTotals(), which counts grade EVENTS, not problems. */
function plannedProblems(){
  const set = new Set();
  for(let n=1;n<=NDAYS;n++){
    const d = getDay(n);
    [].concat(d.blocks.a, d.blocks.b, d.blocks.f, [d.mvd])
      .forEach(t => { if(isLC(t.url)) set.add(slugOf(t.url)); });
  }
  return set;
}
function coverage(){
  const planned = plannedProblems();
  const lc = { total:planned.size, clean:0, rough:0, untouched:0, extra:0, extraClean:0 };
  planned.forEach(sl => {
    const log = S.grades[sl];
    if(!log || !log.length){ lc.untouched++; return; }
    if(log.some(h => h.g === "clean")) lc.clean++; else lc.rough++;
  });
  Object.keys(S.grades).forEach(k => {
    if(planned.has(k)) return;
    lc.extra++;
    if((S.grades[k]||[]).some(h => h.g === "clean")) lc.extraClean++;
  });
  const D = allDesigns(), de = { total:D.length, crisp:0, okay:0, rusty:0, ungraded:0, untouched:0 };
  D.forEach(d => {
    const r = S.designs[d.id] || {};
    if(!(r.attempts > 0)){ de.untouched++; return; }
    if(r.grade === "crisp") de.crisp++;
    else if(r.grade === "okay") de.okay++;
    else if(r.grade === "rusty") de.rusty++;
    else de.ungraded++;
  });
  de.attempted = de.total - de.untouched;
  return { lc, de };
}
function designSpread(){
  const c = { new:0, rusty:0, okay:0, crisp:0 };
  allDesigns().forEach(d => { const r = S.designs[d.id]; c[(r && r.grade) || "new"]++; });
  return c;
}

/* ══════════════════════════════════════════════════════════════════════════

const VW = 340;
function barPath(x,y,w,h,r){
  r = Math.min(r, Math.max(0,w), h/2);
  if(w <= r) return "M"+x+" "+y+"h"+Math.max(w,0)+"v"+h+"h"+(-Math.max(w,0))+"z";
  return "M"+x+" "+y+"h"+(w-r)+"a"+r+" "+r+" 0 0 1 "+r+" "+r+"v"+(h-2*r)+"a"+r+" "+r+" 0 0 1 "+(-r)+" "+r+"h"+(-(w-r))+"z";
}
/* horizontal bars — ONE series, one hue; length carries the magnitude */
function hbars(rows, opts){
  opts = opts || {};
  const labW = opts.labW || 108, gap = 22, h = 11, top = 4;
  const barX = labW + 6, barW = VW - barX - (opts.valW || 42);
  const max = Math.max(1, opts.max || Math.max.apply(null, rows.map(r => r.value)));
  const H = top + rows.length * gap + 2;
  let g = "";
  rows.forEach((r,i) => {
    const y = top + i*gap, w = Math.max(0, r.value / max * barW);
    const fill = r.color || opts.color || "var(--run)";
    g += '<g><title>'+esc(r.label+": "+(r.display != null ? r.display : r.value))+"</title>"+
      '<text class="hbrow" x="0" y="'+(y+h-1)+'">'+esc(r.label)+"</text>"+
      '<rect x="'+barX+'" y="'+y+'" width="'+barW+'" height="'+h+'" rx="4" fill="var(--sunken)"/>'+
      (w > 0.5 ? '<path d="'+barPath(barX,y,w,h,4)+'" fill="'+fill+'"/>' : "")+
      '<text class="hbval" x="'+(VW-1)+'" y="'+(y+h-1)+'" text-anchor="end">'+esc(r.display != null ? r.display : r.value)+"</text>"+
      "</g>";
  });
  return '<svg viewBox="0 0 '+VW+" "+H+'" role="img" aria-label="'+attr(opts.alt||"")+'">'+g+"</svg>";
}
/* one horizontal stacked bar — part-to-whole, 2px surface gaps, direct labels */
function stackBar(segs, opts){
  opts = opts || {};
  const total = segs.reduce((a,s)=>a+s.value,0);
  if(!total) return '<div class="empty" style="padding:11px 12px;font-size:12px">'+esc(opts.empty||"No data yet.")+"</div>";
  const h = 26, GAPPX = 2;
  const live = segs.filter(s=>s.value>0);
  const avail = VW - GAPPX*(live.length-1);
  let x = 0, g = "";
  live.forEach((s,i) => {
    const w = s.value/total*avail;
    const first = i===0, last = i===live.length-1;
    const r = 5;
    let d;
    if(first && last) d = "M0 0h"+VW+"v"+h+"H0z";
    else if(first) d = "M"+r+" 0h"+(w-r)+"v"+h+"H"+r+"a"+r+" "+r+" 0 0 1 "+(-r)+" "+(-r)+"V"+r+"a"+r+" "+r+" 0 0 1 "+r+" "+(-r)+"z";
    else if(last)  d = "M"+x+" 0h"+(w-r)+"a"+r+" "+r+" 0 0 1 "+r+" "+r+"v"+(h-2*r)+"a"+r+" "+r+" 0 0 1 "+(-r)+" "+r+"H"+x+"z";
    else           d = "M"+x+" 0h"+w+"v"+h+"H"+x+"z";
    const pct = Math.round(s.value/total*100);
    g += '<g><title>'+esc(s.label+": "+s.value+" ("+pct+"%)")+"</title>"+
      '<path d="'+d+'" fill="'+s.color+'"/>'+
      (w > 34 ? '<text x="'+(x+w/2)+'" y="17" text-anchor="middle" style="font-family:var(--mono);font-size:10px;font-weight:700" fill="'+(s.fg||"var(--onfill)")+'">'+s.value+"</text>" : "")+
      "</g>";
    x += w + GAPPX;
  });
  return '<svg viewBox="0 0 '+VW+" "+h+'" role="img" aria-label="'+attr(opts.alt||"")+'">'+g+"</svg>";
}
/* stacked columns over time — status segments, 2px gaps, recessive baseline */
function stackCols(days, keys){
  if(!days.length) return '<div class="empty" style="padding:11px 12px;font-size:12px">Nothing graded yet. Grade a DSA problem and this fills in.</div>';
  const H = 96, base = H - 16, top = 6;
  const cw = Math.min(30, (VW - 4) / days.length), gapx = Math.min(6, cw*0.26), bw = cw - gapx;
  const x0 = Math.max(0, (VW - days.length*cw) / 2);
  const max = Math.max(1, ...days.map(d => keys.reduce((a,k)=>a+d[k.key],0)));
  let g = '<line class="axis" x1="0" y1="'+base+'" x2="'+VW+'" y2="'+base+'"/>';
  days.forEach((d,i) => {
    const x = x0 + i*cw + gapx/2;
    let y = base;
    keys.forEach(k => {
      const v = d[k.key]; if(!v) return;
      const hh = v/max*(base-top);
      y -= hh;
      g += '<g><title>'+esc(fmtDate(d.d)+" · "+k.label+": "+v)+"</title>"+
        '<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(hh-2,1)+'" rx="2" fill="'+k.color+'"/></g>';
    });
    if(days.length <= 14 || i % 2 === 0)
      g += '<text class="hbval" x="'+(x+bw/2)+'" y="'+(H-3)+'" text-anchor="middle" style="font-size:8px">'+esc(days.length > 7 ? fmtDate(d.d).replace(/^\w+ /,"") : fmtDate(d.d))+"</text>";
  });
  return '<svg viewBox="0 0 '+VW+" "+H+'" role="img" aria-label="Grade outcomes per day">'+g+"</svg>";
}

function ringSvg(pct, r, sw, cls){
  const c = 2*Math.PI*r, off = c*(1-Math.max(0,Math.min(1,pct)));
  const sz = (r+sw/2+1)*2, ctr = sz/2;
  return '<svg viewBox="0 0 '+sz+" "+sz+'" aria-hidden="true">'+
    '<circle class="tr" cx="'+ctr+'" cy="'+ctr+'" r="'+r+'" fill="none" stroke-width="'+sw+'"/>'+
    '<circle class="arc '+(cls||"")+'" cx="'+ctr+'" cy="'+ctr+'" r="'+r+'" fill="none" stroke-width="'+sw+
      '" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" style="--c:'+c.toFixed(1)+';--o:'+off.toFixed(1)+'"/></svg>';
}

function heroEl(n, day, st){
  const ids = allTaskIds(n), done = ids.filter(id=>S.checks[id]).length;
  const mvdOn = !!S.checks[day.mvd.id];
  const pct = st==="complete" ? 1 : st==="fallback" ? 1 : (ids.length ? done/ids.length : 0);
  const mid = st==="complete" ? "✓" : st==="fallback" ? "◆" : done+"/"+ids.length;
  const d = daysDone(), streak = currentStreak();
  return '<section class="hero" style="'+stVars(st)+'">'+
    '<div class="ring">'+ringSvg(pct, 42, 9)+
      '<div class="ringmid"><b>'+mid+"</b><s>"+(st==="complete"?"complete":st==="fallback"?"fallback":"tasks")+"</s></div></div>"+
    '<div class="herobody">'+
      '<span class="stchip"><i></i>'+esc(ST[st].label)+"</span>"+
      "<h2>"+esc(day.title)+"</h2>"+

        '<div class="hs"><b>'+n+'<span style="color:var(--ink-faint)">/'+NDAYS+'</span></b><span>day</span></div>'+

        '<div class="hs'+(streak?" flame":"")+'"><b>'+streak+"</b><span>streak</span></div>"+
      "</div></div></section>";
}
function phaseStrip(){
  const d = daysDone(), n = activeDay(), today = curDay(), day = getDay(n);
  let out = '<button class="pbtn" data-act="grid" aria-expanded="'+gridOpen+'">'+
    '<span class="pmeta">'+esc(day.stage.toUpperCase())+"</span>"+
    '<span class="pbar"><span class="c" style="width:'+(d.complete/NDAYS*100)+'%"></span>'+
      '<span class="f" style="width:'+(d.fallback/NDAYS*100)+'%"></span></span>'+
    '<span class="pmeta">'+d.total+"/"+NDAYS+"</span>"+
    '<span class="caret'+(gridOpen?" open":"")+'">▼</span></button>';
  if(!gridOpen) return out;
  const w = day.week, w0 = Math.max(1, Math.min(WEEKS-2, w-1));   // 3-week window around today
  let rows = "";
  for(let ww=w0; ww<w0+3 && ww<=WEEKS; ww++){
    rows += '<div class="wklab">wk '+ww+"</div>";
    for(let i=0;i<7;i++){
      const dn = (ww-1)*7+i+1, st = dayState(dn);
      rows += '<button class="gc s-'+st+(dn===n?" here":"")+(getDay(dn).light?" lite":"")+'" data-act="dayjump" data-n="'+dn+'" '+
        'aria-label="Day '+dn+", "+ST[st].label+'"'+(dn===today?' aria-current="date"':"")+">"+dn+"</button>";
    }
  }
  return out+'<div class="gwrap"><div class="grid wk" role="group" aria-label="Three weeks around today">'+
    '<div class="gh"></div>'+WD.map(x=>'<div class="gh">'+x+"</div>").join("")+rows+"</div>"+
    '<div class="legend">'+
      '<span><i style="background:var(--surface-2);border-color:var(--line-strong)"></i>queued</span>'+
      '<span><i style="background:var(--run-bg);border-color:var(--run)"></i>in progress</span>'+
      '<span><i style="background:var(--done)"></i>complete</span>'+
      '<span><i style="background:var(--fall)"></i>fallback · done</span>'+
      '<span><i style="background:var(--surface-3);border-color:var(--line)"></i>light day</span>'+
    "</div></div>";
}

    mvd+
    '<div class="btnrow" style="margin:15px 0 4px">'+

function reviewRow(e, cls){
  const over = e.due ? dayDiff(e.due, todayISO()) : 0;
  return '<button class="lrow '+cls+'" data-act="grade-open" data-slug="'+attr(e.slug)+'">'+
    '<span class="lmain"><span class="ltitle">'+esc(e.title)+"</span>"+
      '<span class="lsub"><span class="gpill '+(e.graduated?"crisp":e.lastGrade==="failed"?"rusty":e.lastGrade==="struggled"?"okay":"new")+'"><i></i>'+esc(intervalLabel(e))+"</span>"+
        "<span>"+(e.graduated?"cleared "+relDay(e.last):(over>0?over+"d late":"due "+fmtDate(e.due)))+"</span>"+
        (e.lastGrade?'<span class="sep">·</span><span>last '+esc(e.lastGrade)+"</span>":"")+
      "</span></span>"+
    '<span class="lstat">'+e.history.length+"<small>reps</small></span></button>";
}
function renderReviews(){
  const t = todayISO(), due = dueReviews(), up = upcomingReviews(), grad = graduatedReviews();
  const overdue = due.filter(e=>dayDiff(e.due,t)>0), todayDue = due.filter(e=>dayDiff(e.due,t)===0);
  const sec = (title, list, cls, empty) =>
    '<div class="sechead"><h3>'+esc(title)+'</h3><span class="n">'+list.length+"</span></div>"+
    (list.length ? list.map(e=>reviewRow(e,cls)).join("") : '<div class="empty">'+esc(empty)+"</div>");
  return shead(["Spaced repetition","+1 · +3 · +7 · +21"], "Review queue")+
    '<p class="hint" style="margin:-6px 2px 14px">Struggled or failed enters at +1 day. A clean solve advances one interval, a struggle repeats the current one, a failure resets to +1 day. Clean at +21 graduates out. Today surfaces the '+REVIEW_CAP+" most urgent.</p>"+
    sec("Overdue", overdue, "overdue", "Nothing late.")+
    sec("Due today", todayDue, "duetoday", "Nothing due today.")+
    sec("Upcoming", up, "", "Nothing scheduled. Problems enter the queue when you grade one struggled or failed.")+
    sec("Graduated", grad, "grad", "Nothing has cleared +21 yet.")+
    '<div style="margin-top:17px"><button class="btn" data-act="add-problem">+ add a problem to the queue</button></div>';
}

function clockText(sec){ const neg = sec<0, a = Math.abs(sec); return (neg?"−":"")+Math.floor(a/60)+":"+p2(a%60); }
function renderStories(){
  if(storyOpen) return renderStoryDetail();
  const list = sortedStories();
  return shead([list.length+" stories","least recently practiced first"], "Story reps")+
    list.map(s=>{
      const r = S.stories[s.id] || {}, stale = r.last ? dayDiff(r.last, todayISO()) : null;
      const cls = stale===null ? "rusty" : stale>=14 ? "rusty" : stale>=7 ? "okay" : "crisp";
      return '<button class="lrow '+cls+'" data-act="story-open" data-id="'+attr(s.id)+'">'+
        '<span class="lmain"><span class="ltitle">'+(s.n?'<span class="mono" style="color:var(--ink-faint);font-size:11px">#'+s.n+"</span> ":"")+esc(s.title)+"</span>"+
          '<span class="lsub"><span>'+esc(relDay(r.last))+"</span>"+(r.last?'<span class="sep">·</span><span>'+esc(fmtDate(r.last))+"</span>":"")+"</span></span>"+
        '<span class="lstat">'+(r.reps||0)+"<small>reps</small></span></button>";
    }).join("")+
    '<div style="margin-top:17px"><button class="btn" data-act="add-story">+ add a story</button></div>';
}
function renderStoryDetail(){
  const s = allStories().find(x=>x.id===storyOpen); if(!s){ storyOpen=null; return renderStories(); }
  const r = storyRec(s.id), left = timer.left, pct = Math.max(0, Math.min(100, left/150*100));
  return '<div class="daynav" style="margin-bottom:13px">'+
      '<button class="nav" data-act="story-close" aria-label="Back to stories">‹</button>'+
      '<span class="daymeta"><span>'+(s.n?"Story #"+s.n:"Story")+"</span><span>"+(r.reps||0)+" reps</span><span>"+esc(relDay(r.last))+"</span></span></div>"+
    '<h1 style="font-size:22px;font-weight:800;font-variation-settings:\'wdth\' 116;line-height:1.12;margin-bottom:14px">'+esc(s.title)+"</h1>"+
    '<div class="card"><div class="clockwrap">'+
      '<div class="clock'+(left<0?" over":timer.running?" live":"")+'" id="clock">'+clockText(left)+"</div>"+
      '<div class="clockbar'+(left<0?" over":"")+'" id="clockbar"><i style="width:'+pct+'%"></i></div>'+
      '<div class="clocklab" id="clocklab">'+(left<0?"over — past 3 min is a ramble":"2:30 spoken rep")+"</div></div>"+
      '<div class="btnrow" style="margin-top:15px">'+
        '<button class="btn pri" data-act="timer-start">'+(timer.running?"Pause":(left!==150?"Resume":"Start"))+"</button>"+
        '<button class="btn" data-act="timer-reset">Reset</button></div>'+
      '<button class="btn" data-act="timer-done" style="margin-top:8px">Done — log a rep</button></div>'+
    '<label class="fl" for="snotes">Bullet notes</label>'+
    '<textarea id="snotes" data-act="story-notes" rows="12" spellcheck="false">'+esc(storyNotes(s))+"</textarea>"+
    '<p class="hint" style="margin-top:9px">Saved as you type. A rep needs no typing — start the timer, talk, tap done.</p>'+
    (r.notes!=null && s.notes ? '<div class="btnrow" style="margin-top:11px"><button class="btn sm" data-act="story-revert">restore seeded notes</button></div>' : "");
}

/* ══════════════════════════════════════════════════════════════════════════
   RENDER — STATS
   ══════════════════════════════════════════════════════════════════════ */
function renderStats(){
  const d = daysDone(), out = outcomeTotals(), byDay = outcomeByDay(14), cov = coverage();
  const bs = blockStats(), sc = stageCounts(), ds = designSpread(), due = dueReviews().length;
  const pct = (a,b) => b ? Math.round(a/b*100) : 0;

  let h = shead(["Phase 1","every figure comes from what you logged"], "Stats");
  h += '<div class="tiles">'+
    '<div class="tile a"><b>'+d.total+'<span style="color:var(--ink-faint);font-size:15px">/'+NDAYS+'</b><span>days done</span><em>'+d.complete+" full · "+d.fallback+" fallback</em></div>"+
    '<div class="tile b"><b>'+currentStreak()+"</b><span>day streak</span><em>best "+bestStreak()+" · fallback holds it</em></div>"+
    '<div class="tile c"><b>'+(out.rate==null?"—":out.rate+"%")+"</b><span>clean solve rate</span><em>"+out.total+" graded</em></div>"+
    '<div class="tile d"><b>'+due+"</b><span>reviews due</span><em>"+Object.keys(S.queue).length+" in queue</em></div>"+
    '<div class="tile a"><b>'+cov.lc.clean+'<span style="color:var(--ink-faint);font-size:15px">/'+cov.lc.total+'</span></b><span>problems solved</span><em>'+
      (cov.lc.rough ? cov.lc.rough+" attempted, not clean yet" : "clean at least once")+
      (cov.lc.extra ? " · +"+cov.lc.extra+" off-plan" : "")+"</em></div>"+
    '<div class="tile c"><b>'+cov.de.attempted+'<span style="color:var(--ink-faint);font-size:15px">/'+cov.de.total+'</span></b><span>designs done</span><em>'+
      cov.de.crisp+" graded crisp</em></div>"+
  "</div>";

  /* coverage — each bar is 100% of its own bank, so the two are readable side by side */
  const lcSeg = [
    { label:"Solved clean",        value:cov.lc.clean,     color:"var(--done)" },
    { label:"Attempted, not clean",value:cov.lc.rough,     color:"var(--fall)" },
    { label:"Not started",         value:cov.lc.untouched, color:"var(--line-strong)", fg:"var(--ink)" }];
  const deSeg = [
    { label:"Crisp",       value:cov.de.crisp,     color:"var(--done)" },
    { label:"Okay",        value:cov.de.okay,      color:"var(--fall)" },
    { label:"Rusty",       value:cov.de.rusty,     color:"var(--alert)" },
    { label:"Ungraded",    value:cov.de.ungraded,  color:"var(--run)" },
    { label:"Not started", value:cov.de.untouched, color:"var(--line-strong)", fg:"var(--ink)" }];
  h += '<section class="chart"><h4>Coverage</h4>'+
    '<div class="cap">How much of each bank you have cleared. A problem counts as solved once you have graded it clean at least once.</div>'+
    '<div class="covrow"><div class="covlab"><b>LeetCode</b><span>'+cov.lc.total+' in the plan</span><em>'+
      cov.lc.clean+"/"+cov.lc.total+"</em></div>"+stackBar(lcSeg,{alt:"LeetCode coverage"})+
      legendRow(lcSeg.filter(x=>x.value>0).map(x=>({label:x.label+" ("+x.value+")",color:x.color})))+"</div>"+
    '<div class="covrow"><div class="covlab"><b>Design questions</b><span>'+cov.de.total+' in the bank</span><em>'+
      cov.de.attempted+"/"+cov.de.total+"</em></div>"+stackBar(deSeg,{alt:"Design coverage"})+
      legendRow(deSeg.filter(x=>x.value>0).map(x=>({label:x.label+" ("+x.value+")",color:x.color})))+"</div>"+
    (cov.lc.extra ? '<p class="hint" style="margin-top:11px">'+cov.lc.extra+" problem"+(cov.lc.extra===1?"":"s")+" you added yourself sit outside the plan's "+cov.lc.total+" and are not counted in the bar above ("+cov.lc.extraClean+" solved clean).</p>" : "")+
  "</section>";

  /* phase map */
  let rows = "";
  for(let w=1; w<=WEEKS; w++){
    rows += '<div class="wklab">'+w+"</div>";
    for(let i=0;i<7;i++){
      const dn = (w-1)*7+i+1, st = dayState(dn);
      rows += '<button class="gc s-'+st+(dn===curDay()?" here":"")+(getDay(dn).light?" lite":"")+'" data-act="dayjump" data-n="'+dn+
        '" aria-label="Day '+dn+", "+ST[st].label+'">'+dn+"</button>";
    }
  }
  h += '<section class="chart"><h4>Phase map</h4><div class="cap">All '+WEEKS+' weeks. Rows are weeks, columns Mon\u2013Sun. Tap any day to open it.</div>'+
    '<div class="mapscroll"><div class="grid wk">'+'<div class="gh"></div>'+WD.map(x=>'<div class="gh">'+x+"</div>").join("")+rows+"</div></div>"+
    '<div class="clegend">'+
      '<span><i style="background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-strong)"></i>queued</span>'+
      '<span><i style="background:var(--run-bg);box-shadow:inset 0 0 0 1px var(--run)"></i>in progress</span>'+
      '<span><i style="background:var(--done)"></i>complete</span>'+
      '<span><i style="background:var(--fall)"></i>fallback · done</span></div></section>';

  /* outcomes over time */
  h += chartCard("trend","Grade outcomes by day","Every DSA grade you logged, most recent 14 active days.",
    '<div class="scroll">'+stackCols(byDay, OUTCOME)+"</div>",
    legendRow(OUTCOME.map(o=>({label:o.label,color:o.color}))),
    ["Day","Clean","Struggled","Failed"],
    byDay.map(x=>[fmtDate(x.d), x.clean, x.struggled, x.failed]));

  /* outcome totals */
  h += chartCard("totals","Outcome mix","All grades ever logged, including first passes that never entered the queue.",
    stackBar(OUTCOME.map(o=>({label:o.label,value:out[o.key],color:o.color})), {empty:"Nothing graded yet.",alt:"Outcome mix"}),
    legendRow(OUTCOME.map(o=>({label:o.label+" ("+out[o.key]+")",color:o.color}))),
    ["Outcome","Count","Share"],
    out.total ? OUTCOME.map(o=>[o.label, out[o.key], pct(out[o.key],out.total)+"%"]) : []);

  /* queue by stage — ordered stages take the ordinal ramp */
  const stageRows = [["+1 day",sc[0],"var(--ord1)"],["+3 days",sc[1],"var(--ord2)"],["+7 days",sc[2],"var(--ord3)"],
                     ["+21 days",sc[3],"var(--ord4)"],["graduated",sc[4],"var(--ord5)"]];
  h += chartCard("stages","Review queue by interval","Problems climb the ladder as you solve them clean. A failure drops one back to +1.",
    hbars(stageRows.map(([l,v,c])=>({label:l,value:v,color:c})), {labW:76,alt:"Queue by interval"}),
    "", ["Interval","Problems"], stageRows.map(([l,v])=>[l,v]));

  /* block completion — one series, one hue */
  const blockRows = [["Sessions",bs.s],["Light days",bs.l],["Fallback",bs.m]]
    .map(([l,v])=>({label:l,value:pct(v[0],v[1]),display:pct(v[0],v[1])+"%"}));
  h += chartCard("blocks","Completion by day type","Share of all "+NDAYS+" days' tasks checked off. Sessions are the 45-minute ones; light days are the 10-minute ones.",
    hbars(blockRows, {labW:82,max:100,alt:"Completion by day type"}),
    "", ["Type","Checked","Total","Rate"],
    [["Sessions",bs.s[0],bs.s[1],pct(bs.s[0],bs.s[1])+"%"],["Light days",bs.l[0],bs.l[1],pct(bs.l[0],bs.l[1])+"%"],
     ["Fallback",bs.m[0],bs.m[1],pct(bs.m[0],bs.m[1])+"%"]]);

  /* story freshness — one series, one hue */
  const sf = sortedStories().map(s=>{ const r=S.stories[s.id]||{};
    const days = r.last ? dayDiff(r.last, todayISO()) : null;
    return { label:(s.n?"#"+s.n+" ":"")+s.title.split(" — ")[0].slice(0,15), value: days==null?30:Math.min(days,30),
             display: days==null?"never":days+"d", raw:days, full:s.title, reps:r.reps||0,
             color: days==null ? "var(--line-strong)" : "var(--run)" }; });
  h += chartCard("stories","Story staleness","Days since each story was last spoken aloud. Never-practiced show as the full bar.",
    hbars(sf, {labW:112,max:30,alt:"Days since practiced"}),
    legendRow([{label:"days since last rep",color:"var(--run)"},{label:"never practiced",color:"var(--line-strong)"}]),
    ["Story","Last practiced","Reps"], sf.map(x=>[x.full, x.display, x.reps]));

  /* design readiness */
  const dsSegs = [{label:"Ungraded",value:ds.new,color:"var(--ink-faint)"},{label:"Rusty",value:ds.rusty,color:"var(--alert)"},
                  {label:"Okay",value:ds.okay,color:"var(--fall)"},{label:"Crisp",value:ds.crisp,color:"var(--done)"}];
  h += chartCard("designs","Design readiness","Self-grades across all "+allDesigns().length+" design questions.",
    stackBar(dsSegs,{alt:"Design readiness"}),
    legendRow(dsSegs.map(s=>({label:s.label+" ("+s.value+")",color:s.color}))),
    ["Grade","Questions"], dsSegs.map(s=>[s.label,s.value]));

  h += '<p class="hint" style="margin:14px 2px 0">Numbers only ever come from what you actually logged — nothing here is estimated or projected.</p>';
  return h;
}

async function offerFile(name, text, title){
  try{
    const blob = new Blob([text], { type: /\.json$/.test(name) ? "application/json" : "text/plain;charset=utf-8" });
    const url  = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
    return;
  }catch(e){}
  sheet = { kind:"export", title:title, text:text }; renderSheet();
}

const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };
function paintClock(){
  const c = $("#clock"); if(!c) return;
  const left = timer.left;
  c.textContent = clockText(left);
  c.className = "clock" + (left<0 ? " over" : timer.running ? " live" : "");
  const bar = $("#clockbar");
  if(bar){ bar.className = "clockbar"+(left<0?" over":"");
           bar.firstElementChild.style.width = Math.max(0, Math.min(100, left/150*100))+"%"; }
  const lab = $("#clocklab");
  if(lab) lab.textContent = left<0 ? "over — past 3 min is a ramble" : (timer.running ? "speaking" : "2:30 spoken rep");
  const btn = document.querySelector('[data-act="timer-start"]');
  if(btn) btn.textContent = timer.running ? "Pause" : (left!==150 ? "Resume" : "Start");
}
function timerStop(){ if(timer.id) clearInterval(timer.id); timer.id=null; timer.running=false; }
function timerToggle(){
  if(timer.running){ timerStop(); paintClock(); return; }
  timer.running = true; timer.buzzed = timer.left <= 0;
  timer.endAt = Date.now() + timer.left*1000;
  timer.id = setInterval(()=>{
    const left = Math.round((timer.endAt - Date.now())/1000);
    timer.left = Math.max(-599, left);
    if(left <= 0 && !timer.buzzed){ timer.buzzed = true; buzz([120,60,120]); }
    if(timer.left <= -599) timerStop();
    paintClock();
  }, 250);
  paintClock();
}
function timerReset(){ timerStop(); timer.left = 150; timer.buzzed = false; paintClock(); }

function taskAt(n, blk, i){ return materialize(n).blocks[blk][i]; }
function celebrateIf(before, n){
  const after = dayState(n);
  if(!isDone(before) && isDone(after)){
    cele = { n, st:after, streak:currentStreak(), done:daysDone().total };
    buzz([16,40,26]);
    return true;
  }
  return false;
}
document.addEventListener("click", ev => {
  if(ev.target.closest("a[href]")) return;
  const el = ev.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act, n = activeDay();

  if(act === "scrim"){ if(ev.target === el){ sheet = null; renderSheet(); flushCele(); } return; }
  if(act === "sheet-close"){ sheet = null; renderSheet(); flushCele(); return; }
  if(act === "cele-close"){ cele = null; renderCele(); return; }

  switch(act){
    case "tab":
      nav(()=>{ view = el.dataset.v; editMode = false; storyOpen = null; designOpen = null;
                timerStop(); timer.left = 150; if(view==="today") lastAction = null; });
      return;
    case "grid": gridOpen = !gridOpen; render(); return;
    case "ctable": tableOpen[el.dataset.k] = !tableOpen[el.dataset.k]; render(); return;
    case "dayjump": nav(()=>{ view="today"; viewDay = +el.dataset.n; editMode = false; lastAction = null; }); return;
    case "daynav": nav(()=>{ viewDay = Math.max(1, Math.min(NDAYS, n + (+el.dataset.d))); editMode = false; lastAction = null; }); return;
    case "today": nav(()=>{ viewDay = null; lastAction = null; }); return;
    case "edit": editMode = !editMode; render(); return;

    case "toggle": {
      const id = el.dataset.id, day = getDay(n), before = dayState(n);
      if(S.checks[id]){ delete S.checks[id]; lastAction = null; markDirty("progress"); buzz(6); render(); return; }
      const t = [].concat(day.blocks.a, day.blocks.b, day.blocks.f, [day.mvd]).find(x => x.id === id);
      S.checks[id] = true; markDirty("progress"); buzz(9);
      if(t && isLC(t.url)){
        pendingCele = { before, n };
        sheet = { kind:"grade", slug:slugOf(t.url), title:t.text, url:t.url, taskId:id };
        render(); renderSheet();
      } else { lastAction = null; celebrateIf(before, n); render(); renderCele(); }
      return;
    }
    case "grade-open": {
      const e = S.queue[el.dataset.slug]; if(!e) return;
      sheet = { kind:"grade", slug:e.slug, title:e.title, url:e.url }; renderSheet(); return;
    }
    case "grade": {
      const g = el.dataset.g;
      if(g){ applyGrade(sheet.slug, sheet.title, sheet.url, g); lastAction = { slug:sheet.slug, grade:g };
             markDirty("queue"); markDirty("progress"); buzz(9); }
      else lastAction = null;
      sheet = null; renderSheet(); flushCele(); render(); return;
    }
    case "undo-grade": undoGrade(el.dataset.slug); lastAction = null; markDirty("queue"); markDirty("progress"); render(); return;

    case "t-add": {
      const ov = materialize(n), blk = el.dataset.blk;
      ov.blocks[blk].push({ id:uid("d"+n+"-"+blk), text:"" });
      markDirty("plan"); render();
      const boxes = document.querySelectorAll('[data-act="t-edit"][data-blk="'+blk+'"]');
      if(boxes.length) boxes[boxes.length-1].focus();
      return;
    }
    case "t-del": {
      const ov = materialize(n), gone = ov.blocks[el.dataset.blk].splice(+el.dataset.i,1)[0];
      if(gone) delete S.checks[gone.id];
      markDirty("plan"); markDirty("progress"); render(); return;
    }
    case "t-up": case "t-down": {
      const arr = materialize(n).blocks[el.dataset.blk], i = +el.dataset.i, j = i + (act==="t-up"?-1:1);
      if(j < 0 || j >= arr.length) return;
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      markDirty("plan"); render(); return;
    }
    case "t-reset": delete S.dayOverrides[n]; markDirty("plan"); editMode = false; render(); return;

    case "story-open": nav(()=>{ storyOpen = el.dataset.id; timerReset(); }); return;
    case "story-close": nav(()=>{ storyOpen = null; timerStop(); timer.left = 150; }); return;
    case "timer-start": timerToggle(); buzz(6); return;
    case "timer-reset": timerReset(); return;
    case "timer-done": {
      const r = storyRec(storyOpen); r.reps = (r.reps||0)+1; r.last = todayISO();
      markDirty("banks"); timerStop(); timer.left = 150; buzz([14,40,14]);
      nav(()=>{ storyOpen = null; }); return;
    }
    case "story-revert": storyRec(storyOpen).notes = null; markDirty("banks"); render(); return;

    case "design-open": nav(()=>{ designOpen = el.dataset.id; }); return;
    case "design-close": nav(()=>{ designOpen = null; }); return;
    case "design-grade": designRec(designOpen).grade = el.dataset.g || null; markDirty("banks"); buzz(6); render(); return;
    case "design-attempt": {
      const r = designRec(designOpen);
      r.attempts = (r.attempts||0)+1; r.prevLast = r.last; r.last = todayISO();
      markDirty("banks"); buzz(9); render(); return;
    }
    case "design-undo": {
      const r = designRec(designOpen);
      r.attempts = Math.max(0,(r.attempts||0)-1); r.last = r.prevLast || null; r.prevLast = null;
      markDirty("banks"); render(); return;
    }

    case "add-story":   sheet = { kind:"add", what:"story" };   renderSheet(); return;
    case "add-design":  sheet = { kind:"add", what:"design" };  renderSheet(); return;
    case "add-problem": sheet = { kind:"add", what:"problem" }; renderSheet(); return;
    case "add-do": {
      const name = (sheet.name||"").trim();
      if(!name){ sheet.err = "Give it a name."; renderSheet(); return; }
      if(sheet.what === "story"){
        S.customStories.push({ id:uid("s"), title:name, notes:"S — \nT — \nA — \nR — " });
        markDirty("banks"); sheet = null; renderSheet(); render(); return;
      }
      if(sheet.what === "design"){
        S.customDesigns.push({ id:uid("d"), grp:"cl", title:name, prompt:(sheet.url||"").trim(), added:true });
        markDirty("banks"); sheet = null; renderSheet(); render(); return;
      }
      const url = (sheet.url||"").trim();
      if(!isLC(url)){ sheet.err = "Needs a leetcode.com/problems/… URL so the queue can key on it."; renderSheet(); return; }
      sheet = { kind:"grade", slug:slugOf(url), title:name, url:url }; renderSheet(); return;
    }

    case "export-txt":  offerFile("prep-log-"+todayISO()+".txt", exportText(), "Plain-text export"); return;
    case "export-json": offerFile("prep-log-backup-"+todayISO()+".json", JSON.stringify(snapshot(),null,2), "JSON backup"); return;
    case "import-open": sheet = { kind:"import", text:"" }; renderSheet(); return;
    case "import-do": {
      let o; try{ o = JSON.parse(sheet.text||""); }catch(e){ sheet.err = "That is not valid JSON."; renderSheet(); return; }
      if(!o || typeof o !== "object"){ sheet.err = "That is not a backup file."; renderSheet(); return; }
      touched.clear();
      DOC_NAMES.forEach(k => absorb(k, o[k]));
      DOC_NAMES.forEach(k => markDirty(k));
      sheet = null; viewDay = null; storyOpen = null; designOpen = null;
      renderSheet(); render(); return;
    }
    case "reset-open": sheet = { kind:"reset", text:"" }; renderSheet(); return;
    case "reset-do": {
      if(sheet.text !== "RESET") return;
      S.checks = {}; S.grades = {}; S.queue = {}; S.stories = {}; S.designs = {};
      S.customStories = []; S.customDesigns = []; S.dayOverrides = {}; S.seq = 1;
      DOC_NAMES.forEach(k => markDirty(k));
      sheet = null; cele = null; view = "today"; viewDay = null; editMode = false;
      storyOpen = null; designOpen = null; lastAction = null;
      renderSheet(); renderCele(); render(); return;
    }
  }
});
let pendingCele = null;
function flushCele(){
  if(!pendingCele) return;
  const p = pendingCele; pendingCele = null;
  if(celebrateIf(p.before, p.n)) renderCele();
}

document.addEventListener("input", ev => {
  const el = ev.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act, n = activeDay();
  if(act === "t-edit"){ taskAt(n, el.dataset.blk, +el.dataset.i).text = el.value; markDirty("plan"); return; }
  if(act === "t-url"){
    const t = taskAt(n, el.dataset.blk, +el.dataset.i), v = el.value.trim();
    if(v) t.url = v; else delete t.url;
    markDirty("plan"); return;
  }
  if(act === "story-notes"){ storyRec(storyOpen).notes = el.value; markDirty("banks"); return; }
  if(act === "design-gaps"){ designRec(designOpen).gaps = el.value; markDirty("banks"); return; }
  if(act === "startdate"){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(el.value)) return;
    S.settings.startDate = el.value; viewDay = null; markDirty("plan"); render(); return;
  }
  if(act === "resetconf"){
    sheet.text = el.value.trim().toUpperCase();
    const b = document.querySelector('[data-act="reset-do"]');
    if(b) b.disabled = sheet.text !== "RESET";
    return;
  }
  if(act === "importtext"){ sheet.text = el.value; return; }
  if(act === "addname"){ sheet.name = el.value; return; }
  if(act === "addurl"){ sheet.url = el.value; return; }
});
document.addEventListener("change", ev => {
  const el = ev.target.closest('[data-act="import-file"]'); if(!el || !el.files || !el.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => { sheet.text = String(fr.result); sheet.err = null; renderSheet(); };
  fr.onerror = () => { sheet.err = "Could not read that file."; renderSheet(); };
  fr.readAsText(el.files[0]);
});
document.addEventListener("keydown", ev => {
  if(ev.key === "Escape"){ if(cele){ cele=null; renderCele(); return; } if(sheet){ sheet=null; renderSheet(); flushCele(); return; } }
  if(sheet && sheet.kind === "grade" && !/^(INPUT|TEXTAREA)$/.test(ev.target.tagName)){
    const g = { "1":"clean", "2":"struggled", "3":"failed" }[ev.key];
    if(g){ const b = document.querySelector('[data-act="grade"][data-g="'+g+'"]'); if(b){ ev.preventDefault(); b.click(); } return; }
  }
  if((ev.key === "Enter" || ev.key === " ") && ev.target.closest && ev.target.closest('[role="button"][data-act]')){
    ev.preventDefault(); ev.target.closest('[role="button"][data-act]').click();
  }
});

/* ── gestures: swipe between days, pull down for today, drag sheets away ── */
let tp = null;
const APP = $("#app");
APP.addEventListener("touchstart", e => {
  if(e.touches.length !== 1 || sheet || cele || editMode){ tp = null; return; }
  tp = { x:e.touches[0].clientX, y:e.touches[0].clientY, t:Date.now(), sc:window.scrollY, dir:null };
}, { passive:true });
APP.addEventListener("touchmove", e => {
  if(!tp) return;
  const dx = e.touches[0].clientX - tp.x, dy = e.touches[0].clientY - tp.y;
  if(!tp.dir && (Math.abs(dx) > 9 || Math.abs(dy) > 9)) tp.dir = Math.abs(dx) > Math.abs(dy)*1.4 ? "h" : "v";
  if(tp.dir === "v" && view === "today" && tp.sc <= 0 && dy > 0 && activeDay() !== curDay()){
    const el = $("#pull");
    if(el){ const h = Math.min(54, dy*0.45); el.style.height = h+"px";
            el.textContent = h >= 38 ? "release — jump to today" : "pull for today";
            el.className = "pull"+(h >= 38 ? " armed" : ""); }
  }
}, { passive:true });
APP.addEventListener("touchend", e => {
  if(!tp) return; const s = tp; tp = null;
  const el = $("#pull"); if(el){ el.style.height = "0px"; el.textContent = ""; el.className = "pull"; }
  const dx = e.changedTouches[0].clientX - s.x, dy = e.changedTouches[0].clientY - s.y;
  if(s.dir === "h" && view === "today" && Math.abs(dx) > 54 && Date.now()-s.t < 800){
    const n = activeDay(), nn = Math.max(1, Math.min(NDAYS, n + (dx < 0 ? 1 : -1)));
    if(nn !== n){ buzz(6); nav(()=>{ viewDay = nn; lastAction = null; }); }
  } else if(s.dir === "v" && view === "today" && s.sc <= 0 && dy >= 86 && activeDay() !== curDay()){
    buzz(10); nav(()=>{ viewDay = null; lastAction = null; });
  }
}, { passive:true });

let sd = null;
$("#sheetroot").addEventListener("touchstart", e => {
  const el = e.target.closest(".sheet");
  if(!el || el.scrollTop > 0 || e.touches.length !== 1){ sd = null; return; }
  sd = { y:e.touches[0].clientY, el:el };
}, { passive:true });
$("#sheetroot").addEventListener("touchmove", e => {
  if(!sd) return;
  const dy = e.touches[0].clientY - sd.y;
  if(dy > 0) sd.el.style.transform = "translateY("+dy+"px)";
}, { passive:true });
$("#sheetroot").addEventListener("touchend", e => {
  if(!sd) return; const d = sd; sd = null;
  const dy = e.changedTouches[0].clientY - d.y;
  d.el.style.transition = "transform .2s";
  if(dy > 84){ sheet = null; renderSheet(); flushCele(); }
  else d.el.style.transform = "";
}, { passive:true });

/* ══════════════════════════════════════════════════════════════════════════
   BOOT — paint from seed instantly, reconcile when storage lands
   ══════════════════════════════════════════════════════════════════════ */
render();
connect();
document.addEventListener("visibilitychange", () => { if(document.hidden) flush(); else reconcile(); });
window.addEventListener("pagehide", flush);

/* ══════════════════════════════════════════════════════════════════════════
   PWA RUNTIME
   ══════════════════════════════════════════════════════════════════════ */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(()=>{}); });
}
let deferredInstall = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; installBar(true); });
window.addEventListener("appinstalled", () => { deferredInstall = null; installBar(false); });
function installBar(show){
  let el = document.getElementById("installbar");
  if(!show){ if(el) el.remove(); return; }
  if(el) return;
  el = document.createElement("div");
  el.id = "installbar";
  el.innerHTML = '<span>Install Prep Log for offline use</span>' +
    '<button data-i="go">Install</button><button data-i="no" aria-label="Dismiss">\u2715</button>';
  el.addEventListener("click", async ev => {
    const b = ev.target.closest("button"); if(!b) return;
    if(b.dataset.i === "no"){ installBar(false); return; }
    if(!deferredInstall) return;
    const p = deferredInstall; deferredInstall = null;
    installBar(false); p.prompt(); try{ await p.userChoice; }catch(e){}
  });
  document.body.appendChild(el);
}
</script>

</body>
